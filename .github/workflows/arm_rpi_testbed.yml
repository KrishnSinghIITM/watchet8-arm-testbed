name: Arm64 SSH Testbed (Raspberry Pi 5 Equivalent)

on:
  workflow_dispatch:

jobs:
  arm64-session:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Arm Architecture Diagnostics
        run: |
          echo "=== CPU Architecture ==="
          uname -m
          echo "=== Core Specs & SIMD Flags ==="
          lscpu | grep -E "Architecture|Model name|Flags|CPU\(s\):|Byte Order"
          echo "=== Memory Diagnostics ==="
          free -h

      - name: Setup Tmate Directly
        run: |
          sudo apt-get update && sudo apt-get install -y tmate openssh-client
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          echo "=========================================================="
          echo "=== YOUR SSH CONNECTION COMMAND (RUN IN POWERSHELL):   ==="
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo "=== OR OPEN THIS WEB TERMINAL URL IN YOUR BROWSER:     ==="
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
          echo "=========================================================="
          # Keep session alive for interactive use
          while [ ! -f /tmp/stop ]; do sleep 2; done
